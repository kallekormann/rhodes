# Optional overlay: Supabase Storage API with S3 backend (MinIO locally).
# App code unchanged — still uses Supabase Storage buckets (library-files, document-images).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.s3.yml up -d
#
# VPS: same Storage service env, point GLOBAL_S3_ENDPOINT at Hetzner/R2 instead of MinIO.
# See docs/33-storage-and-bandwidth.md and Supabase self-hosted S3 guide.

services:
  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 5
    volumes:
      - minio-data:/data

  minio-createbucket:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set supa-minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing supa-minio/${GLOBAL_S3_BUCKET}
      "

  storage:
    depends_on:
      minio-createbucket:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    # S3 backend — drop file volume mounts from base/dev compose.
    volumes: []

  imgproxy:
    volumes: []

volumes:
  minio-data:
